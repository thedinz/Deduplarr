services:
  deduplarr:
    image: ghcr.io/thedinz/deduplarr:latest
    container_name: deduplarr
    ports:
      - "7889:7889"
    environment:
      PORT: "7889"
      CONFIG_DIR: /config
      # Scheduled scans run in this time zone.
      TZ: "Etc/UTC"
      # User and group that own /config and run the app (Unraid: 99 / 100).
      PUID: "1000"
      PGID: "1000"
      # Optional: override the generated session signing secret.
      # SESSION_SECRET: change-me-to-a-long-random-string
    volumes:
      - ./config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7889/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
